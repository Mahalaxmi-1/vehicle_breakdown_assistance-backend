# Production must receive explicit connection details and a single frontend origin.
# Do not set schema generation to update/create: production remains validation-only.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=${ROADASSIST_COOKIE_SAME_SITE:none}

ROADASSIST_FRONTEND_ORIGIN=${ROADASSIST_FRONTEND_ORIGIN}
