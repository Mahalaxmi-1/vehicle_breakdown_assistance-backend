
spring.application.name=roadassist-backend

# MySQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/roadassist_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=${PORT:8080}

# Nearby mechanic eligibility radius, in kilometres.
roadassist.matching.radius-km=25

# Configure a private Nominatim-compatible geocoder. Public Nominatim is deliberately rejected
# because breakdown and home service addresses may be sensitive personal location data.
roadassist.geocoding.base-url=${ROADASSIST_GEOCODER_BASE_URL:}
roadassist.geocoding.user-agent=${ROADASSIST_GEOCODER_USER_AGENT:RoadAssist/1.0 (local student project)}
roadassist.geocoding.min-interval-ms=${ROADASSIST_GEOCODER_MIN_INTERVAL_MS:1000}

# Session cookie: HTTP is allowed for local development; require HTTPS in production.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${ROADASSIST_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${ROADASSIST_COOKIE_SAME_SITE:lax}
